# Local / single-VPS stack. For serious production use managed MongoDB (Atlas) + managed Redis.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/aviator?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    deploy: { replicas: 1 }   # the game engine must run as exactly ONE instance
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
volumes: { mongo-data: {}, redis-data: {} }
